<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <title>NoteDesk</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegação do NoteDesk">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <img id="brand-icon" alt="" />
          </span>
          <span class="brand-name"><span>Note</span><strong>Desk</strong></span>
        </div>

        <button class="new-note-button" id="new-note" type="button">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 4.25v11.5M4.25 10h11.5" />
          </svg>
          <span>Nova página</span>
        </button>

        <div class="sidebar-section">
          <p class="section-label">PÁGINAS</p>
          <div class="notes-placeholder" id="notes-placeholder">
            <span class="placeholder-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M7 3.75h7l4.25 4.3v12.2H7a2 2 0 0 1-2-2v-12.5a2 2 0 0 1 2-2Z" />
                <path d="M14 4v4.5h4.25" />
              </svg>
            </span>
            <p>Suas páginas aparecerão aqui.</p>
          </div>
          <div class="notes-list" id="notes-list" aria-label="Páginas salvas"></div>
        </div>

        <div class="sidebar-footer">
          <button class="settings-button" id="settings-button" type="button" aria-label="Configurações de aparência" aria-expanded="false" aria-controls="theme-menu">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M10.4 3.5h3.2l.6 2.1 1.7.7 1.9-1 2.3 2.3-1 1.9.7 1.7 2.1.6v3.2l-2.1.6-.7 1.7 1 1.9-2.3 2.3-1.9-1-1.7.7-.6 2.1h-3.2l-.6-2.1-1.7-.7-1.9 1-2.3-2.3 1-1.9-.7-1.7-2.1-.6v-3.2l2.1-.6.7-1.7-1-1.9 2.3-2.3 1.9 1 1.7-.7.6-2.1Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <p class="notes-location" aria-label="Local das páginas">Salvas em <span id="notes-location-path">localizando...</span></p>
          <div class="theme-menu" id="theme-menu" hidden>
            <p>Aparência</p>
            <button type="button" data-theme-choice="light">Tema claro</button>
            <button type="button" data-theme-choice="dark">Tema escuro</button>
          </div>
        </div>
      </aside>

      <section class="workspace" aria-label="Editor de página">
        <header class="topbar">
          <div class="breadcrumb" aria-label="Localização atual">
            <span class="breadcrumb-muted">Meu espaço</span>
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="m6 3.5 4.5 4.5L6 12.5" />
            </svg>
            <span class="breadcrumb-current" id="breadcrumb-title">Nova página</span>
          </div>
          <span class="made-with">Feito com o &lt;3</span>
        </header>

        <main class="editor-area">
          <div class="editor-content">
            <p class="editor-eyebrow">PÁGINA</p>
            <label class="visually-hidden" for="note-title">Título da página</label>
            <input
              class="title-input"
              id="note-title"
              type="text"
              placeholder="Sem título"
              autocomplete="off"
              spellcheck="true"
            />

            <div class="editor-rule" aria-hidden="true"></div>

            <label class="visually-hidden" for="note-body">Conteúdo da página</label>
            <textarea
              class="note-body"
              id="note-body"
              placeholder="Comece a escrever..."
              spellcheck="true"
            ></textarea>

            <footer class="editor-footer">
              <span id="word-count" aria-live="polite">0 palavras · 0 caracteres</span>
              <span id="draft-status" role="status">salvamento automático</span>
            </footer>
          </div>
        </main>
      </section>
    </div>
  </body>
</html>
